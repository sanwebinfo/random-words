description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v6.1.0
      with:
        version: 12.16.1
    - uses: actions/setup-node@v6.5.0
      with:
        node-version: '24.22.1'
        cache: pnpm
    - run: pnpm install
      shell: bash
  using: composite